services:
  newsletter-app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      GUARDIAN_API_KEY: "${GUARDIAN_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1}"
    volumes:
      - news_data:/app/data
    networks:
      - ativaai

volumes:
  news_data:

networks:
  ativaai:
    external: true